[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-cursor-bridge"
version = "0.1.0"
description = "High-performance OpenAI-compatible routing layer bridging Google Antigravity (agy CLI) into Cursor IDE"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Emmanuel Cascacius" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agy-cursor = "agy_cursor_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_cursor_bridge"]
